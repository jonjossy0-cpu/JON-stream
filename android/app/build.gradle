plugins {
    id 'com.android.application' version '8.7.3'
}

android {
    namespace 'com.jonstream.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.jonstream.app'
        minSdk 23
        targetSdk 35
        versionCode 7
        versionName '7.1'
    }

    flavorDimensions += "device"

    productFlavors {
        mobile {
            dimension "device"
            applicationId "com.jonstream.app"
            versionCode 10
            versionName "7.4"
        }
        tv {
            dimension "device"
            applicationId "com.jonstream.tv"
            versionCode 8
            versionName "8.0"
        }
    }

    signingConfigs {
        release {
            def storeFilePath = System.getenv("JON_RELEASE_STORE_FILE")
            def storePasswordValue = System.getenv("JON_RELEASE_STORE_PASSWORD")
            def keyAliasValue = System.getenv("JON_RELEASE_KEY_ALIAS")
            def keyPasswordValue = System.getenv("JON_RELEASE_KEY_PASSWORD")
            if (storeFilePath && storePasswordValue && keyAliasValue && keyPasswordValue) {
                storeFile file(storeFilePath)
                storePassword storePasswordValue
                keyAlias keyAliasValue
                keyPassword keyPasswordValue
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            signingConfig signingConfigs.release
        }
    }
}

def copyJonLogo = tasks.register("copyJonLogo", Copy) {
    from(rootProject.projectDir.parentFile.toPath().resolve("logo.png").toFile())
    into(layout.projectDirectory.dir("src/main/res/drawable"))
    rename { "jon_logo.png" }
}

tasks.named("preBuild").configure {
    dependsOn(copyJonLogo)
}

dependencies {
    implementation 'androidx.webkit:webkit:1.14.0'
    tvImplementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.5.0'
    tvImplementation 'androidx.browser:browser:1.10.0'
}

/*
 * Prepare fullscreen controls and mobile-only assets for Mobile APK 7.4.
 * The shared source HTML remains unchanged for Android TV APK 8.0.
 */
android.sourceSets.mobile.assets.srcDir(layout.buildDirectory.dir("generated/mobile/assets"))

def prepareMobileFullscreenControls = tasks.register("prepareMobileFullscreenControls") {
    def sourceFile = layout.projectDirectory.file("../../index.html")
    def outputFile = layout.buildDirectory.file("generated/mobile/assets/index.html")
    def sponsorCssFile = layout.projectDirectory.file("src/mobile/assets/jon-sponsor-carousel.css")
    def sponsorJsFile = layout.projectDirectory.file("src/mobile/assets/jon-sponsor-carousel.js")
    inputs.file(sourceFile)
    inputs.file(sponsorCssFile)
    inputs.file(sponsorJsFile)
    outputs.file(outputFile)

    doLast {
        def html = sourceFile.asFile.getText("UTF-8")
        if (!sponsorCssFile.asFile.isFile() || !sponsorJsFile.asFile.isFile()) {
            throw new GradleException("Missing Mobile APK sponsor carousel assets.")
        }
        if (html.contains("jon-sponsor-carousel.js") || html.contains("jon-sponsor-carousel.css")) {
            throw new GradleException("Mobile sponsor carousel is already injected in the base HTML.")
        }
        def bottomMarker = '    <div class="tv-fullscreen-bottom">\n'
        if (html.count(bottomMarker) != 1) {
            throw new GradleException("Expected one fullscreen bottom bar in the base HTML.")
        }
        // The root JON Stream HTML is the Mobile APK source of truth; avoid duplicate controls.
        if (!html.contains('id="tvFullscreenPrevious"') && !html.contains('id="tvFullscreenNext"')) {
            def controls = bottomMarker +
                    '     <button type="button" onclick="previousTV()" id="tvFullscreenPrevious" aria-label="Previous channel" title="Previous channel">⏮</button>\n' +
                    '     <button type="button" onclick="nextTV()" id="tvFullscreenNext" aria-label="Next channel" title="Next channel">⏭</button>\n'
            html = html.replace(bottomMarker, controls)
        } else if (!html.contains('id="tvFullscreenPrevious"') || !html.contains('id="tvFullscreenNext"')) {
            throw new GradleException("Only one fullscreen channel navigation control exists in the source HTML.")
        }

        def style = '\n<style id="jonMobileFullscreenChannelNav">\n' +
                '/* Compact fullscreen channel navigation: icons only, minimal space. */\n' +
                '#tvVideoFrame .tv-fullscreen-bottom #tvFullscreenPrevious,\n' +
                '#tvVideoFrame .tv-fullscreen-bottom #tvFullscreenNext{min-width:34px;width:34px;min-height:32px;padding:4px;font-size:15px;line-height:1;flex:0 0 34px}\n' +
                '</style>\n'
        if (!html.contains("</head>")) {
            throw new GradleException("Missing HTML head closing tag.")
        }
        if (!html.contains('id="jonMobileFullscreenChannelNav"')) {
            html = html.replace("</head>", style + "</head>")
        }
        def mobileLinks = ''
        if (!html.contains('href="jon-news-ticker.css"')) mobileLinks += ' <link rel="stylesheet" href="jon-news-ticker.css">\n'
        if (!html.contains('href="jon-sponsor-carousel.css"')) mobileLinks += ' <link rel="stylesheet" href="jon-sponsor-carousel.css">\n'
        if (mobileLinks) html = html.replace("</head>", mobileLinks + "</head>")

        if (html.count("</html>") != 1) {
            throw new GradleException("Expected one HTML closing tag before injecting the mobile news ticker.")
        }
        def mobileScripts = ''
        if (!html.contains('src="jon-news-ticker.js"')) mobileScripts += ' <script src="jon-news-ticker.js"></script>\n'
        if (!html.contains('src="jon-sponsor-carousel.js"')) mobileScripts += ' <script src="jon-sponsor-carousel.js"></script>\n'
        if (mobileScripts) html = html.replace("</html>", mobileScripts + "</html>")

        /* Mobile-only Firebase channel tier labels; keep shared HTML and TV APK unchanged. */
        def originalMapping = "        group:typeof x.category==='string'&&x.category.trim()?x.category.trim():(typeof x.group==='string'&&x.group.trim()?x.group.trim():'TV Channel'),\n        id:x.id==null?'':String(x.id),"
        def tierMapping = "        group:typeof x.category==='string'&&x.category.trim()?x.category.trim():(typeof x.group==='string'&&x.group.trim()?x.group.trim():'TV Channel'),\n        accessTier:String(x.accessTier||'free').toLowerCase()==='premium'?'premium':'free',\n        id:x.id==null?'':String(x.id),"
        if (html.contains("accessTier:String(x.accessTier||'free')")) {
            // Root HTML already contains the Firebase access-tier mapping.
        } else if (html.count(originalMapping) == 1) {
            html = html.replace(originalMapping, tierMapping)
        } else {
            throw new GradleException("Mobile tier fix: Firebase mapping not found safely.")
        }

        def originalMerge = "      const merged=[...tvChannels,...incoming];"
        if (html.count(originalMerge) == 1) {
            html = html.replace(originalMerge, "      /* Prefer current Firebase tier metadata over local duplicates. */\n      const merged=[...incoming,...tvChannels];")
        } else if (!html.contains("const merged=[...incoming,...tvChannels];")) {
            // The current root HTML may use a different Firebase merge implementation.
            // Do not rewrite unrelated channel-loading code automatically.
        }

        /* Actual source line uses four leading spaces; assert exactly one match. */
        def originalCard = '    <div class="tv-country">${escapeHTML(channel.country||channel.group||"TV Channel")}</div>'
        def tierCard = originalCard + '\n    <span class="jon-access-tier ${String(channel.accessTier||"free").toLowerCase()==="premium"?"premium":"free"}">${String(channel.accessTier||"free").toLowerCase()==="premium"?"PREMIUM / PAID":"FREE"}</span>'
        if (!html.contains('class="jon-access-tier')) {
            if (html.count(originalCard) != 1) throw new GradleException("Mobile tier fix: channel card label not found safely.")
            html = html.replace(originalCard, tierCard)
        }
        def tierCss = '\n<style id="jonMobileAccessTier">.jon-access-tier{display:inline-block;margin-top:4px;padding:3px 7px;border-radius:6px;font-size:10px;font-weight:800;letter-spacing:.25px;line-height:1.2}.jon-access-tier.free{color:#86efac;background:#14532d;border:1px solid #166534}.jon-access-tier.premium{color:#fde68a;background:#78350f;border:1px solid #92400e}</style>\n'
        if (!html.contains('id="jonMobileAccessTier"')) html = html.replace("</head>", tierCss + "</head>")

        def target = outputFile.get().asFile
        target.parentFile.mkdirs()
        target.setText(html, "UTF-8")
    }
}

tasks.named("preBuild").configure {
    dependsOn(prepareMobileFullscreenControls)
}
