plugins {
    id 'com.android.application' version '8.7.3'
}

android {
    namespace 'com.jonstream.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.jonstream.app'
        minSdk 23
        targetSdk 35
        versionCode 7
        versionName '7.1'
    }

    flavorDimensions += "device"

    productFlavors {
        mobile {
            dimension "device"
            applicationId "com.jonstream.app"
            versionCode 7
            versionName "7.1"
        }
        tv {
            dimension "device"
            applicationId "com.jonstream.tv"
            versionCode 8
            versionName "8.0"
        }
    }

    signingConfigs {
        release {
            def storeFilePath = System.getenv("JON_RELEASE_STORE_FILE")
            def storePasswordValue = System.getenv("JON_RELEASE_STORE_PASSWORD")
            def keyAliasValue = System.getenv("JON_RELEASE_KEY_ALIAS")
            def keyPasswordValue = System.getenv("JON_RELEASE_KEY_PASSWORD")
            if (storeFilePath && storePasswordValue && keyAliasValue && keyPasswordValue) {
                storeFile file(storeFilePath)
                storePassword storePasswordValue
                keyAlias keyAliasValue
                keyPassword keyPasswordValue
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            signingConfig signingConfigs.release
        }
    }
}

def copyJonLogo = tasks.register("copyJonLogo", Copy) {
    from(rootProject.projectDir.parentFile.toPath().resolve("logo.png").toFile())
    into(layout.projectDirectory.dir("src/main/res/drawable"))
    rename { "jon_logo.png" }
}

tasks.named("preBuild").configure {
    dependsOn(copyJonLogo)
}

dependencies {
    implementation 'androidx.webkit:webkit:1.14.0'
    tvImplementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.5.0'
    tvImplementation 'androidx.browser:browser:1.8.0'
}

/*
 * Generate fullscreen channel controls only for Mobile APK 7.1.
 * The shared source HTML remains unchanged for Android TV APK 8.0.
 */
android.sourceSets.mobile.assets.srcDir(layout.buildDirectory.dir("generated/mobile/assets"))

def prepareMobileFullscreenControls = tasks.register("prepareMobileFullscreenControls") {
    def sourceFile = layout.projectDirectory.file("src/main/assets/index.html")
    def outputFile = layout.buildDirectory.file("generated/mobile/assets/index.html")
    def sponsorCssFile = layout.projectDirectory.file("src/mobile/assets/jon-sponsor-carousel.css")
    def sponsorJsFile = layout.projectDirectory.file("src/mobile/assets/jon-sponsor-carousel.js")
    inputs.file(sourceFile)
    inputs.file(sponsorCssFile)
    inputs.file(sponsorJsFile)
    outputs.file(outputFile)

    doLast {
        def html = sourceFile.asFile.getText("UTF-8")
        if (!sponsorCssFile.asFile.isFile() || !sponsorJsFile.asFile.isFile()) {
            throw new GradleException("Missing Mobile APK sponsor carousel assets.")
        }
        if (html.contains("jon-sponsor-carousel.js") || html.contains("jon-sponsor-carousel.css")) {
            throw new GradleException("Mobile sponsor carousel is already injected in the base HTML.")
        }
        def bottomMarker = '    <div class="tv-fullscreen-bottom">\n'
        if (html.count(bottomMarker) != 1) {
            throw new GradleException("Expected one fullscreen bottom bar in the base HTML.")
        }
        if (html.contains('id="tvFullscreenPrevious"') || html.contains('id="tvFullscreenNext"')) {
            throw new GradleException("Fullscreen channel controls already exist in the base HTML.")
        }

        def controls = bottomMarker +
                '     <button type="button" onclick="previousTV()" id="tvFullscreenPrevious" aria-label="Previous channel" title="Previous channel">⏮</button>\n' +
                '     <button type="button" onclick="nextTV()" id="tvFullscreenNext" aria-label="Next channel" title="Next channel">⏭</button>\n'
        html = html.replace(bottomMarker, controls)

        def style = '\n<style id="jonMobileFullscreenChannelNav">\n' +
                '/* Compact fullscreen channel navigation: icons only, minimal space. */\n' +
                '#tvVideoFrame .tv-fullscreen-bottom #tvFullscreenPrevious,\n' +
                '#tvVideoFrame .tv-fullscreen-bottom #tvFullscreenNext{min-width:34px;width:34px;min-height:32px;padding:4px;font-size:15px;line-height:1;flex:0 0 34px}\n' +
                '</style>\n'
        if (!html.contains("</head>")) {
            throw new GradleException("Missing HTML head closing tag.")
        }
        html = html.replace("</head>", style + ' <link rel="stylesheet" href="jon-news-ticker.css">\n <link rel="stylesheet" href="jon-sponsor-carousel.css">\n' + "</head>")

        if (html.count("</html>") != 1) {
            throw new GradleException("Expected one HTML closing tag before injecting the mobile news ticker.")
        }
        if (html.contains("jon-news-ticker.js")) {
            throw new GradleException("Mobile news ticker script is already injected.")
        }
        html = html.replace("</html>", ' <script src="jon-news-ticker.js"></script>\n <script src="jon-sponsor-carousel.js"></script>\n</html>')

        // Mobile-only: refresh Premium entitlement while the APK remains open.
        // Do not edit the shared HTML, so Android TV and the website are unchanged.
        def premiumExpiryRefresh = '''
 // Recheck entitlement while the Mobile APK stays open; the API is authoritative.
 let jonSilentSubscriptionRefreshRunning=false;
 async function refreshPremiumEntitlementQuietly(){
   const user=auth.currentUser;
   if(!user||!user.emailVerified||jonSilentSubscriptionRefreshRunning)return;
   if(window.jonPremiumAccess&&window.jonPremiumAccess.status==="checking")return;
   jonSilentSubscriptionRefreshRunning=true;
   try{
     const token=await user.getIdToken();
     const response=await fetch("https://jon-stream.vercel.app/api/subscription/status",{
       method:"GET",
       headers:{Authorization:"Bearer "+token,Accept:"application/json"},
       cache:"no-store"
     });
     const data=await response.json().catch(()=>({}));
     if(auth.currentUser!==user)return;
     if(!response.ok)throw new Error(data.error||("Subscription API returned HTTP "+response.status));
     window.jonPremiumAccess={ready:true,allowed:data.hasPremium===true,status:String(data.status||"free")};
     window.dispatchEvent(new CustomEvent("jon-premium-access-changed",{detail:window.jonPremiumAccess}));
     if(!document.getElementById("jonAccountPanel")?.hidden){
       $("jonProfilePlan").textContent=data.planLabel||data.status||"No active subscription";
       $("jonProfileRemaining").textContent=Number.isFinite(data.daysRemaining)?data.daysRemaining+" day(s)":(data.remainingLabel||"—");
       $("jonProfilePayment").textContent=data.paymentLabel||"—";
       $("jonAccountMessage").textContent=data.message||(data.hasPremium?"Premium access is active.":"Free channels remain available. Premium requires an active trial or entitlement.");
     }
   }catch(error){
     if(auth.currentUser!==user)return;
     window.jonPremiumAccess={ready:true,allowed:false,status:"api_error"};
     window.dispatchEvent(new CustomEvent("jon-premium-access-changed",{detail:window.jonPremiumAccess}));
     console.warn("JON silent subscription refresh failed; Premium access closed safely",error);
   }finally{
     jonSilentSubscriptionRefreshRunning=false;
   }
 }
 setInterval(refreshPremiumEntitlementQuietly,30000);
 document.addEventListener("visibilitychange",()=>{if(!document.hidden)refreshPremiumEntitlementQuietly();});
 window.addEventListener("focus",refreshPremiumEntitlementQuietly);
''';
        def premiumAuthAnchor = ' window.addEventListener("jon-account-panel-open",()=>{if(auth.currentUser)showSubscription(auth.currentUser);});'
        if (html.count(premiumAuthAnchor) != 1) {
            throw new GradleException("Expected one mobile Premium authentication refresh anchor.")
        }
        html = html.replace(premiumAuthAnchor, premiumAuthAnchor + premiumExpiryRefresh)


        def target = outputFile.get().asFile
        target.parentFile.mkdirs()
        target.setText(html, "UTF-8")
    }
}

tasks.named("preBuild").configure {
    dependsOn(prepareMobileFullscreenControls)
}
