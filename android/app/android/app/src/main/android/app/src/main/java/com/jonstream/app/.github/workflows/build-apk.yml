name: Build JON Stream APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: gradle :android:app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JON-Stream-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
