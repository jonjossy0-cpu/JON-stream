<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#07111f">
<title>JON FM ETHIOPIA</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@1.7.3/dist/hls.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mpegts.js@1.8.2/dist/mpegts.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dashjs@5.2.1/dist/dash.all.min.js"></script>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
  import { initializeAppCheck, ReCaptchaV3Provider } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app-check.js";
  import { getAnalytics } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-analytics.js";
  import { getFirestore, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";
  import { getStorage, ref as storageRef, getDownloadURL } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-storage.js";

  const firebaseConfig = {
    apiKey: "AIzaSyC5uNWNp9KbcepO36VQCx8gfbyPmZW4fxM",
    authDomain: "jon-stream.firebaseapp.com",
    projectId: "jon-stream",
    storageBucket: "jon-stream.firebasestorage.app",
    messagingSenderId: "189801194527",
    appId: "1:189801194527:web:c7d99f83a2c4c604fa212a",
    measurementId: "G-CEEKQDJXFS"
  };

  try {
    const app = initializeApp(firebaseConfig);
    const appCheck = initializeAppCheck(app, {
      provider: new ReCaptchaV3Provider("6Le3cbYtAAAAAOdcVa3NOG1Md2ZADXvlnvf-ZlU1"),
      isTokenAutoRefreshEnabled: true
    });
    window.__JON_APP_CHECK = appCheck;
    try { getAnalytics(app); } catch (_) {}

    const db = getFirestore(app);
    const storage = getStorage(app);
    window.__JON_RESOLVE_MEDIA_URL = async function(value){ const v=String(value??"").trim(); if(!v)return ""; if(/^https?:\/\//i.test(v)||/^data:/i.test(v)||/^blob:/i.test(v))return v; try{return await getDownloadURL(storageRef(storage,v.startsWith("gs://")?v:v.replace(/^\/+/,"")))}catch(e){console.warn("JON media URL could not be resolved:",v,e);return "";} };
    const ref = doc(db, "jonStream", "appData");
    onSnapshot(ref, (snap) => {
      window.__JON_FIREBASE_DATA = snap.exists() ? snap.data() : null;
      window.dispatchEvent(new CustomEvent("jon-firebase-data", {
        detail: window.__JON_FIREBASE_DATA
      }));
    }, (error) => {
      console.error("JON Stream Firestore listener failed:", error);
      window.dispatchEvent(new CustomEvent("jon-firebase-error", {detail: error}));
    });
  } catch (error) {
    console.error("JON Stream Firebase connection failed:", error);
    window.dispatchEvent(new CustomEvent("jon-firebase-error", {detail: error}));
  }
</script>
