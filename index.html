<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#07111f">
<title>JON FM ETHIOPIA</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#07111f;
  color:#fff;
}

.container{
  max-width:560px;
  margin:auto;
  padding:18px;
}

/* LOGO */
.brand{
  text-align:center;
  padding:8px 0 20px;
}

.logo{
  width:135px;
  height:135px;
  object-fit:cover;
  border-radius:28px;
  display:block;
  margin:auto;
  box-shadow:0 8px 30px rgba(0,0,0,.55);
}

.brand h1{
  margin:15px 0 5px;
  font-size:28px;
}

.brand p{
  margin:0;
  color:#9eabba;
}

/* PLAYER */
.player{
  background:linear-gradient(145deg,#121f32,#0d1727);
  border:1px solid #263750;
  border-radius:22px;
  padding:20px;
  margin-bottom:18px;
}

.live{
  text-align:center;
  color:#ff4b55;
  font-weight:800;
  font-size:19px;
}

.now{
  text-align:center;
  margin-top:9px;
  color:#c6d0dc;
  font-size:14px;
}

audio{
  width:100%;
  margin-top:18px;
}

.buttons{
  display:flex;
  gap:10px;
  margin-top:14px;
}

button{
  border:0;
  border-radius:13px;
  padding:14px;
  color:white;
  background:#e31b23;
  font-size:16px;
  font-weight:700;
  cursor:pointer;
}

.buttons button{
  flex:1;
}

.stop{
  background:#263750;
}

/* SEARCH */
.search{
  margin-bottom:16px;
}

.search input{
  width:100%;
  padding:15px 17px;
  border-radius:14px;
  border:1px solid #293c55;
  outline:none;
  background:#111d2e;
  color:#fff;
  font-size:16px;
}

.search input::placeholder{
  color:#78889c;
}

/* TITLE */
.title{
  font-size:20px;
  margin:18px 3px 12px;
}

/* RADIO */
.station{
  background:#111d2e;
  border:1px solid #253750;
  border-radius:17px;
  padding:15px;
  margin-bottom:10px;
  display:flex;
  align-items:center;
  gap:12px;
}

.station-info{
  flex:1;
  min-width:0;
}

.station-name{
  font-size:16px;
  font-weight:700;
  margin-bottom:5px;
}

.station-status{
  font-size:12px;
  color:#8797aa;
}

.live-dot{
  width:11px;
  height:11px;
  background:#e31b23;
  border-radius:50%;
  flex-shrink:0;
  box-shadow:0 0 10px #e31b23;
}

.station button{
  width:62px;
  height:48px;
  padding:0;
  font-size:19px;
  flex-shrink:0;
}

/* FOOTER */
.footer{
  text-align:center;
  padding:28px 10px 15px;
  color:#718096;
  font-size:13px;
}

.footer strong{
  color:#fff;
  font-size:14px;
}

.footer-logo{
  width:65px;
  height:65px;
  object-fit:cover;
  border-radius:15px;
  margin-bottom:10px;
}
</style>
</head>

<body>

<div class="container">

<!-- JON MEDIA SERVICE LOGO -->
<div class="brand">

  <img
    src="logo.png"
    class="logo"
    alt="JON Media Service Logo">

  <h1>JON FM ETHIOPIA</h1>

  <p>🇪🇹 Ethiopian Digital Radio</p>

</div>


<!-- RADIO PLAYER -->
<div class="player">

  <div class="live">
    🔴 LIVE RADIO
  </div>

  <div class="now" id="nowPlaying">
    Select a radio station
  </div>

  <audio
    id="radioPlayer"
    controls
    preload="none">
  </audio>

  <div class="buttons">

    <button onclick="playCurrent()">
      ▶ PLAY
    </button>

    <button
      class="stop"
      onclick="stopRadio()">
      ⏹ STOP
    </button>

  </div>

</div>


<!-- SEARCH -->
<div class="search">

  <input
    type="text"
    id="search"
    placeholder="🔎 Search radio station..."
    oninput="searchStations()">

</div>


<h2 class="title">
  📻 Ethiopian Radio Stations
</h2>


<!-- STATIONS -->
<div id="stations"></div>


<!-- FOOTER -->
<div class="footer">

  <img
    src="logo.png"
    class="footer-logo"
    alt="JON Media Service">

  <br>

  🇪🇹 Ethiopian Radio Streaming

  <br><br>

  <strong>
    Powered by JON Media Service
  </strong>

</div>

</div>

];

  url: "https://stream.zeno.fm/0sfp5ucnfceuv?acu-uid=1485963383459&an-uid=6511064188082061080&eps-uid=AQAJha7PRmrAjQJjnW46AQEBAQEBAQCe7nnlnwEBAJ7ueeWf&amb-uid=7936042185125426536&dbm-uid=CAESEPZmMwoAovi245ifhMjHqWQ&cto-uid=7e2693d3-4c2c-4064-b5a3-2477306d6c35&bsw-uid=0be78c2d-29a9-4047-9afc-c81884a96418&dyn-uid=2160598537686749688&ttd-uid=23b9c13e-e596-4f09-96ff-c5ff53f1c0e5"
},


const player =
  document.getElementById("radioPlayer");

const nowPlaying =
  document.getElementById("nowPlaying");

const stationContainer =
  document.getElementById("stations");

let currentStation = null;


/* SHOW STATIONS */

function renderStations(list){

  stationContainer.innerHTML = "";

  if(list.length === 0){

    stationContainer.innerHTML =
      '<div style="text-align:center;color:#8898aa;padding:25px;">No radio station found.</div>';

    return;
  }


  list.forEach(function(station){

    const index =
      stations.indexOf(station);

    const div =
      document.createElement("div");

    div.className =
      "station";

    div.innerHTML = `

      <div class="live-dot"></div>

      <div class="station-info">

        <div class="station-name">
          ${station.name}
        </div>

        <div class="station-status">
          🔴 Live Stream
        </div>

      </div>

      <button
        onclick="selectStation(${index})">
        ▶
      </button>

    `;

    stationContainer.appendChild(div);

  });

}


/* SELECT RADIO */

function selectStation(index){

  currentStation =
    stations[index];

  player.src =
    currentStation.url;

  nowPlaying.innerHTML =
    "🔴 Now Playing: <b>" +
    currentStation.name +
    "</b>";

  player.play().catch(function(){

    nowPlaying.innerHTML =
      "▶ Tap PLAY to start " +
      currentStation.name;

  });

}


/* PLAY */

function playCurrent(){

  if(!currentStation){

    currentStation =
      stations[0];

    player.src =
      currentStation.url;

    nowPlaying.innerHTML =
      "🔴 Now Playing: <b>" +
      currentStation.name +
      "</b>";

  }

  player.play().catch(function(){

    nowPlaying.innerHTML =
      "▶ Tap PLAY again to start the stream";

  });

}


/* STOP */

function stopRadio(){

  player.pause();

  player.removeAttribute("src");

  player.load();

  nowPlaying.innerHTML =
    "Radio stopped";

}


/* SEARCH */

function searchStations(){

  const query =
    document
      .getElementById("search")
      .value
      .toLowerCase()
      .trim();

  const filtered =
    stations.filter(function(station){

      return station.name
        .toLowerCase()
        .includes(query);

    });

  renderStations(filtered);

}


/* PLAYER ERROR */

player.addEventListener(
  "error",
  function(){

    if(currentStation){

      nowPlaying.innerHTML =
        "⚠️ Stream unavailable: " +
        currentStation.name;

    }

  }
);


/* START */

renderStations(stations);

</script>

</html>
