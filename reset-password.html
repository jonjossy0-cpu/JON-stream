<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<title>Reset password — JON Stream</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#0b1020;color:#f8fafc}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px;background:radial-gradient(ellipse at top,#172554,#0b1020 62%)}
main{width:min(100%,440px);padding:28px;border:1px solid #334155;border-radius:20px;background:#111827;box-shadow:0 18px 60px #0005}
h1{font-size:1.65rem;margin:0 0 8px}p{color:#cbd5e1;line-height:1.55}
label{display:block;margin:18px 0 7px;font-weight:650}
input{display:block;width:100%;min-height:54px;padding:13px 14px;border:1px solid #64748b;border-radius:10px;background:#0b1220;color:#fff;font:inherit;font-size:16px;letter-spacing:.02em;appearance:none;-webkit-appearance:none;pointer-events:auto;user-select:text;-webkit-user-select:text;touch-action:manipulation}
.entry{position:relative}.entry input{padding-right:84px}.toggle{position:absolute;right:8px;top:7px;min-height:40px;padding:6px 10px;border:0;background:transparent;color:#93c5fd;font-weight:700}
button.primary{width:100%;min-height:52px;margin-top:22px;border:0;border-radius:10px;background:#2563eb;color:white;font:inherit;font-weight:750;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}#status{padding:11px 12px;border-radius:9px;background:#1e293b;overflow-wrap:anywhere}#status:empty{display:none}.error{color:#fecaca!important}.success{color:#bbf7d0!important}.hint{font-size:.9rem;color:#94a3b8}
</style>
</head>
<body>
<main>
<h1>Set a new password</h1>
<p>Choose a new password for your JON Stream account.</p>
<div id="status" role="status" aria-live="polite">Checking your reset link…</div>
<form id="resetForm" hidden>
<label for="newPassword">New password</label>
<div class="entry"><input id="newPassword" name="newPassword" type="password" autocomplete="new-password" minlength="6" required aria-describedby="passwordHint"><button class="toggle" id="togglePassword" type="button">Show</button></div>
<p id="passwordHint" class="hint">Use at least 6 characters.</p>
<label for="confirmPassword">Confirm new password</label>
<div class="entry"><input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" minlength="6" required><button class="toggle" id="toggleConfirm" type="button">Show</button></div>
<button id="submitButton" class="primary" type="submit">Save new password</button>
</form>
<p class="hint">If this link has expired, request a new password reset email from the JON Stream sign-in page.</p>
</main>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
import { getAuth, verifyPasswordResetCode, confirmPasswordReset } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyC5uNWNp9KbcepO36VQCx8gfbyPmZW4fxM",
  authDomain: "jon-stream.firebaseapp.com",
  projectId: "jon-stream",
  storageBucket: "jon-stream.firebasestorage.app",
  messagingSenderId: "189801194527",
  appId: "1:189801194527:web:c7d99f83a2c4c604fa212a",
  measurementId: "G-CEEKQDJXFS"
};
const status = document.getElementById("status");
const form = document.getElementById("resetForm");
const password = document.getElementById("newPassword");
const confirmPassword = document.getElementById("confirmPassword");
const submit = document.getElementById("submitButton");
const params = new URLSearchParams(location.search);
const mode = params.get("mode");
const oobCode = params.get("oobCode");
let auth;
function showStatus(text, kind="") {
  status.textContent = text;
  status.className = kind;
}
function setupToggle(buttonId, input) {
  document.getElementById(buttonId).addEventListener("click", () => {
    const reveal = input.type === "password";
    input.type = reveal ? "text" : "password";
    document.getElementById(buttonId).textContent = reveal ? "Hide" : "Show";
    input.focus();
  });
}
setupToggle("togglePassword", password);
setupToggle("toggleConfirm", confirmPassword);

try {
  if (mode !== "resetPassword" || !oobCode) throw new Error("This reset link is incomplete. Open the latest password reset email and use its link.");
  auth = getAuth(initializeApp(firebaseConfig));
  await verifyPasswordResetCode(auth, oobCode);
  showStatus("Reset link verified. Enter your new password below.", "success");
  form.hidden = false;
} catch (error) {
  console.error("Password reset link verification failed:", error);
  const code = error?.code || "";
  showStatus(
    code === "auth/expired-action-code" || code === "auth/invalid-action-code"
      ? "This password reset link has expired or has already been used. Request a new reset email and open the newest link."
      : (error?.message || "Could not verify this reset link. Request a new password reset email."),
    "error"
  );
}

form.addEventListener("submit", async (event) => {
  event.preventDefault();
  if (!auth || !oobCode) return;
  const nextPassword = password.value;
  if (nextPassword.length < 6) {
    showStatus("Your password must contain at least 6 characters.", "error");
    password.focus();
    return;
  }
  if (nextPassword !== confirmPassword.value) {
    showStatus("The passwords do not match. Please enter them again.", "error");
    confirmPassword.focus();
    return;
  }
  submit.disabled = true;
  submit.textContent = "Saving…";
  showStatus("Saving your new password…");
  try {
    await confirmPasswordReset(auth, oobCode, nextPassword);
    form.hidden = true;
    showStatus("Your password has been changed successfully. Return to JON Stream and sign in with your new password.", "success");
    history.replaceState({}, document.title, location.pathname);
  } catch (error) {
    console.error("Password reset failed:", error);
    const code = error?.code || "";
    showStatus(
      code === "auth/expired-action-code" || code === "auth/invalid-action-code"
        ? "This reset link has expired or has already been used. Request a new reset email."
        : code === "auth/weak-password"
          ? "Choose a stronger password with at least 6 characters."
          : "Could not change the password. Check your connection and try again, or request a new reset email.",
      "error"
    );
  } finally {
    submit.disabled = false;
    submit.textContent = "Save new password";
  }
});
</script>
</body>
</html>
