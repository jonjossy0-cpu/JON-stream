name: Premium playback authorization tests

on:
  pull_request:
    paths:
      - "api/_lib/playbackTicket.js"
      - "tests/playback-ticket.test.js"
      - "package.json"
      - ".github/workflows/premium-playback-tests.yml"
  push:
    branches:
      - mainv
      - feature/premium-playback-ticket-v1
    paths:
      - "api/_lib/playbackTicket.js"
      - "tests/playback-ticket.test.js"
      - "package.json"
      - ".github/workflows/premium-playback-tests.yml"

permissions:
  contents: read

jobs:
  playback-ticket-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run playback ticket unit tests
        run: npm test
