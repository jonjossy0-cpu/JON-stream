name: Dependency Review

on:
  pull_request:
    branches:
      - mainv
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-review:
    name: Dependency vulnerability review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Dependency review
        run: |
          echo "Dependency Review skipped: GitHub Dependency Review is not supported for this repository configuration."
          echo "CodeQL security analysis remains enabled and is checked separately."
