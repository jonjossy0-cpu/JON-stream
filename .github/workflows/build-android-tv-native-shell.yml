name: Build JON Stream Android TV Native Fullscreen Test

on:
  workflow_dispatch:
  push:
    branches:
      - android-tv-native-fullscreen-shell-20261010
    paths:
      - "ANDROID-TV-APK/native-shell/**"
      - ".github/workflows/build-android-tv-native-shell.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout isolated TV-only source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The legacy "tools" SDK package no longer exists on current SDK repositories.
          packages: platform-tools

      - name: Install Android platform and build tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Add JON launcher icon only to the TV test app
        run: |
          set -euo pipefail
          mkdir -p ANDROID-TV-APK/native-shell/app/src/main/res/mipmap-nodpi
          cp Logo.png ANDROID-TV-APK/native-shell/app/src/main/res/mipmap-nodpi/ic_launcher.png

      - name: Build debug APK
        working-directory: ANDROID-TV-APK/native-shell
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Upload installable test APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: JON-Stream-Android-TV-Native-Fullscreen-Test
          path: ANDROID-TV-APK/native-shell/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
