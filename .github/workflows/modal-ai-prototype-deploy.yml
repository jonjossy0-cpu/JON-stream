name: Deploy JON Stream AI prototype to Modal

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout isolated experiment branch
        uses: actions/checkout@v4
        with:
          ref: experiment/modal-ai-video-enhancement
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install Modal CLI
        run: python -m pip install -r experiments/modal-ai-video-enhancement/modal-requirements.txt
      - name: Verify Modal credentials are configured
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: |
          if [ -z "$MODAL_TOKEN_ID" ] || [ -z "$MODAL_TOKEN_SECRET" ]; then
            echo "::error::Missing repository Actions secrets MODAL_TOKEN_ID and/or MODAL_TOKEN_SECRET."
            exit 1
          fi
      - name: Deploy isolated prototype to Modal
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: modal deploy experiments/modal-ai-video-enhancement/modal_app.py
