name: Deploy JON Stream AI prototype to Modal

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/modal-ai-video-enhancement
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install Modal CLI
        run: python -m pip install -r experiments/modal-ai-video-enhancement/modal-requirements.txt
      - name: Verify Modal credentials
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: |
          if [ -z "$MODAL_TOKEN_ID" ] || [ -z "$MODAL_TOKEN_SECRET" ]; then
            echo "Missing GitHub Actions secrets MODAL_TOKEN_ID and MODAL_TOKEN_SECRET."
            echo "Add them in Settings > Secrets and variables > Actions before running this workflow."
            exit 1
          fi
      - name: Deploy isolated prototype
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: modal deploy experiments/modal-ai-video-enhancement/modal_app.py
