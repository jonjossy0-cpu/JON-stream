name: Modal AI prototype checks

on:
  push:
    branches:
      - experiment/modal-ai-video-enhancement
    paths:
      - "experiments/modal-ai-video-enhancement/**"
      - ".github/workflows/modal-ai-prototype-check.yml"
  pull_request:
    paths:
      - "experiments/modal-ai-video-enhancement/**"
      - ".github/workflows/modal-ai-prototype-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/modal-ai-video-enhancement
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: experiments/modal-ai-video-enhancement/modal-requirements.txt
      - name: Install Modal SDK and API dependencies
        run: python -m pip install -r experiments/modal-ai-video-enhancement/modal-requirements.txt
      - name: Install CPU-only test dependencies
        run: python -m pip install pytest httpx
      - name: Compile prototype and tests
        run: python -m py_compile experiments/modal-ai-video-enhancement/modal_app.py experiments/modal-ai-video-enhancement/tests/test_modal_api.py
      - name: Validate Modal decorators and FastAPI app import
        run: python -c "import runpy; runpy.run_path('experiments/modal-ai-video-enhancement/modal_app.py')"
      - name: Run API security and health smoke tests (no GPU)
        run: python -m pytest -q experiments/modal-ai-video-enhancement/tests/test_modal_api.py
