name: Build JON Stream APK

on:
  workflow_dispatch:
  pull_request:
    branches:
      - mainv
  push:
    branches:
      - mainv

permissions:
  contents: read

jobs:
  security-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Check for obvious committed secrets
        shell: bash
        run: |
          set -euo pipefail
          if git grep -nE '-----BEGIN (RSA|OPENSSH|EC|DSA) PRIVATE KEY-----|ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|xox[baprs]-[A-Za-z0-9-]{20,}|sk-[A-Za-z0-9]{20,}' -- . ':!*.md'; then
            echo "Potential hard-coded secret detected. Remove it before building."
            exit 1
          fi

  build:
    needs: security-check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        with:
          gradle-version: '8.9'

      - name: Prepare release signing keystore
        shell: bash
        env:
          JON_RELEASE_KEYSTORE_B64: ${{ secrets.JON_RELEASE_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          test -n "${JON_RELEASE_KEYSTORE_B64}" || {
            echo "Missing GitHub secret: JON_RELEASE_KEYSTORE_B64"
            exit 1
          }
          umask 077
          printf '%s' "${JON_RELEASE_KEYSTORE_B64}" | base64 --decode > "${RUNNER_TEMP}/jon-stream-release.jks"
          test -s "${RUNNER_TEMP}/jon-stream-release.jks"

      - name: Normalize release signing keystore for Android Gradle Plugin
        shell: bash
        env:
          JON_RELEASE_STORE_PASSWORD: ${{ secrets.JON_RELEASE_STORE_PASSWORD }}
          JON_RELEASE_KEY_ALIAS: ${{ secrets.JON_RELEASE_KEY_ALIAS }}
        run: |
          set -euo pipefail
          test -n "${JON_RELEASE_STORE_PASSWORD}" || { echo "Missing JON_RELEASE_STORE_PASSWORD"; exit 1; }
          test -n "${JON_RELEASE_KEY_ALIAS}" || { echo "Missing JON_RELEASE_KEY_ALIAS"; exit 1; }
          keytool -importkeystore -noprompt \
            -srckeystore "${RUNNER_TEMP}/jon-stream-release.jks" \
            -srcstoretype PKCS12 \
            -srcstorepass "${JON_RELEASE_STORE_PASSWORD}" \
            -srcalias "${JON_RELEASE_KEY_ALIAS}" \
            -srckeypass "${JON_RELEASE_STORE_PASSWORD}" \
            -destkeystore "${RUNNER_TEMP}/jon-stream-release-android.jks" \
            -deststoretype JKS \
            -deststorepass "${JON_RELEASE_STORE_PASSWORD}" \
            -destkeypass "${JON_RELEASE_STORE_PASSWORD}" \
            -destalias "${JON_RELEASE_KEY_ALIAS}"
          keytool -list -keystore "${RUNNER_TEMP}/jon-stream-release-android.jks" \
            -storepass "${JON_RELEASE_STORE_PASSWORD}" \
            -alias "${JON_RELEASE_KEY_ALIAS}" >/dev/null
          test -s "${RUNNER_TEMP}/jon-stream-release-android.jks"

      - name: Build signed Release APK
        working-directory: android
        env:
          JON_RELEASE_STORE_FILE: ${{ runner.temp }}/jon-stream-release-android.jks
          JON_RELEASE_STORE_PASSWORD: ${{ secrets.JON_RELEASE_STORE_PASSWORD }}
          JON_RELEASE_KEY_ALIAS: ${{ secrets.JON_RELEASE_KEY_ALIAS }}
          JON_RELEASE_KEY_PASSWORD: ${{ secrets.JON_RELEASE_STORE_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "${JON_RELEASE_STORE_PASSWORD}" || { echo "Missing JON_RELEASE_STORE_PASSWORD"; exit 1; }
          test -n "${JON_RELEASE_KEY_ALIAS}" || { echo "Missing JON_RELEASE_KEY_ALIAS"; exit 1; }
          gradle :app:assembleRelease
      - name: Upload signed Release APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: JON-Stream-Release-APK
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
