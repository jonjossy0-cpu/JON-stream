name: Build JON Stream Android TV (TV Bro)

on:
  workflow_dispatch:
  push:
    branches:
      - android-tv-real-tvbro-isolated-20261009
    paths:
      - "ANDROID-TV-APK/**"
      - ".github/workflows/build-android-tv-tvbro.yml"

permissions:
  contents: read

jobs:
  build-android-tv:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout TV-only build instructions
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Fetch pinned official TV Bro source
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/truefedex/tv-bro.git "${RUNNER_TEMP}/tv-bro"
          git -C "${RUNNER_TEMP}/tv-bro" checkout --detach 6cb4b7c9be1bc2a231cc2590c184faa2be9c4ff3

      - name: Apply JON Stream TV-only customization
        run: python3 ANDROID-TV-APK/patch_tvbro.py "${RUNNER_TEMP}/tv-bro"

      - name: Build installable debug APK
        working-directory: ${{ runner.temp }}/tv-bro
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew --no-daemon :app:assembleGoogleGeckoExcludedDebug

      - name: Upload Android TV APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: JON-Stream-Android-TV-TV-Bro
          path: ${{ runner.temp }}/tv-bro/app/build/outputs/apk/googleGeckoExcluded/debug/*.apk
          if-no-files-found: error
