name: Premium Firebase Functions Check

on:
  push:
    branches:
      - fix/premium-firebase-functions
  pull_request:
    branches:
      - mainv
    paths:
      - "functions/**"
      - "firebase.json"
      - ".github/workflows/premium-functions-check.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install function dependencies
        run: npm --prefix functions install --ignore-scripts
      - name: Syntax-check function source
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find functions -type f -name '*.js' -print0)
      - name: Verify Firebase Functions manifest
        run: node -e "const p=require('./functions/package.json'); const f=require('./firebase.json'); if(p.engines.node!=='22'||f.functions.runtime!=='nodejs22') process.exit(1); console.log('Node.js 22 runtime configuration OK')"
